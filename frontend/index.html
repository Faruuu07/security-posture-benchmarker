<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Security AI Tool | Farhan</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.container {
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.08);
    border-radius:16px;
    padding:30px;
    width:360px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

input {
    width:90%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:none;
    background: rgba(255,255,255,0.1);
    color:white;
}

button {
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:10px;
    background: linear-gradient(45deg,#ff416c,#ff4b2b);
    color:white;
    cursor:pointer;
}

#responseBox {
    margin-top:15px;
    max-height:220px;
    overflow:auto;
    text-align:left;
}

.success { color:#00ffcc; }
.error { color:#ff4d4d; }

.loader {
    border:4px solid rgba(255,255,255,0.2);
    border-top:4px solid #00c6ff;
    border-radius:50%;
    width:25px;
    height:25px;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin {
    0% {transform:rotate(0deg);}
    100% {transform:rotate(360deg);}
}

pre {
    background:#000;
    color:#00ffcc;
    padding:10px;
    border-radius:8px;
    overflow-x:auto;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" style="display:none;">
    <h3><i class="fa-solid fa-lock"></i> Login</h3>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
    <p id="loginMsg"></p>
</div>

<!-- MAIN -->
<div id="mainApp" style="display:none;">
    <h3><i class="fa-solid fa-shield-halved"></i> Security AI</h3>

    <input id="userInput" placeholder="Try: XSS, SQL Injection">

    <button onclick="sendData()">Explain</button>
    <button onclick="getHistory()">History</button>
    <button onclick="clearHistory()">Clear</button>
    <button onclick="logout()">Logout</button>

    <div id="responseBox"></div>
</div>

</div>

<script>
const BASE_URL = "https://security-posture-benchmarker.onrender.com";

/* ✅ CONTROL LOGIN FLOW */
window.onload = () => {
    const token = localStorage.getItem("token");

    if (token) {
        loginBox.style.display = "none";
        mainApp.style.display = "block";
    } else {
        loginBox.style.display = "block";
        mainApp.style.display = "none";
    }
};

/* 🔐 LOGIN */
async function login(){
    loginMsg.innerHTML = "<div class='loader'></div>";

    try{
        const res = await fetch(`${BASE_URL}/login`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
                username: username.value,
                password: password.value
            })
        });

        const data = await res.json();

        if(data.token){
            localStorage.setItem("token", data.token);

            loginMsg.innerHTML = "<span class='success'>✅ Login Success</span>";

            setTimeout(()=>{
                loginBox.style.display="none";
                mainApp.style.display="block";
            },800);

        } else {
            loginMsg.innerHTML = "<span class='error'>❌ Wrong credentials</span>";
        }

    }catch{
        loginMsg.innerHTML = "<span class='error'>❌ Server error</span>";
    }
}

/* 🚪 LOGOUT */
function logout(){
    localStorage.removeItem("token");
    location.reload();
}

/* 🤖 DESCRIBE */
async function sendData(){
    const token = localStorage.getItem("token");

    if(!token){
        alert("Login first!");
        return;
    }

    responseBox.innerHTML = "<div class='loader'></div>";

    const res = await fetch(`${BASE_URL}/describe`,{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+token
        },
        body: JSON.stringify({input:userInput.value})
    });

    if(res.status === 401){
        alert("Session expired. Login again.");
        logout();
        return;
    }

    const data = await res.json();

    responseBox.innerHTML = marked.parse(data.response);
}

/* 📜 HISTORY */
async function getHistory(){
    const token = localStorage.getItem("token");

    const res = await fetch(`${BASE_URL}/history`,{
        headers:{ "Authorization":"Bearer "+token }
    });

    const data = await res.json();

    let out="";
    data.forEach(i=>{
        out += `<p><b>${i.input}</b><br>${i.response}</p><hr>`;
    });

    responseBox.innerHTML = out;
}

/* 🧹 CLEAR */
async function clearHistory(){
    const token = localStorage.getItem("token");

    await fetch(`${BASE_URL}/clear-history`,{
        method:"POST",
        headers:{ "Authorization":"Bearer "+token }
    });

    responseBox.innerHTML = "🧹 Cleared";
}
</script>

</body>
</html>
